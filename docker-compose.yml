services:
  db:
    image: pgvector/pgvector:pg16
    container_name: askbharat-db
    environment:
      POSTGRES_USER: askbharat
      POSTGRES_PASSWORD: askbharat
      POSTGRES_DB: askbharat
    ports:
      # 5433 on the host to avoid colliding with a local Postgres on 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askbharat -d askbharat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
